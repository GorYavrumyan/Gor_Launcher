<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="titleDocs">Документация — GOR Launcher</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <script>try { if (localStorage.getItem('gor_theme') === 'light') document.body.classList.add('light-mode'); } catch (e) { }</script>

    <div class="glow-bg"></div>

    <header class="navbar">
        <div class="logo" id="logo">
            <span class="logo-icon"><i class="fa-solid fa-gamepad"></i></span>
            <span class="logo-text">GOR<span class="highlight">LAUNCHER</span></span>
        </div>
        <nav>
            <a href="index.html" data-i18n="navHome">Главная</a>
            <a href="docs.html" class="nav-btn" data-i18n="navDocs">Документация</a>
            <a href="download.html" data-i18n="navDownload">Загрузить</a>
        </nav>

        <div class="header-controls">
            <div class="lang-selector">
                <button id="lang-btn" class="ctrl-btn" aria-haspopup="true" data-i18n-title="langTitle" title="Язык">
                    <i class="fa-solid fa-globe"></i> <span id="current-lang">RU</span>
                </button>
                <div class="lang-dropdown">
                    <button data-lang="ru">Русский</button>
                    <button data-lang="en">English</button>
                    <button data-lang="am">Հայերեն</button>
                </div>
            </div>

            <button id="theme-toggle" class="ctrl-btn" data-i18n-title="themeTitle" title="Сменить тему">
                <i class="fa-solid fa-sun" id="theme-icon"></i>
            </button>
        </div>
    </header>

    <section class="section">
        <h1 class="section-title" data-i18n="docsTitle">ПОЛНАЯ ДОКУМЕНТАЦИЯ И <span class="gradient-text">API
                РУКОВОДСТВО</span></h1>

        <div class="docs-search-wrap">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" id="docs-search" class="docs-search" onkeyup="filterDocs()"
                data-i18n-placeholder="docsSearchPh"
                placeholder="Поиск по документации (QWebChannel, Sunshine, PyQt6, JSON)...">
        </div>

        <div class="docs-layout">
            <aside class="docs-sidebar">
                <h3 class="sidebar-title" data-i18n="docsSidebar">Разделы</h3>
                <ul id="sidebar-menu" class="sidebar-menu"></ul>
            </aside>

            <div id="docs-container" class="docs-main"></div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 GOR Launcher Project. <span data-i18n="footer">Работает на Python и PyQt6.</span></p>
    </footer>

    <script src="docs-data.js"></script>
    <script src="script.js"></script>
</body>

</html>
